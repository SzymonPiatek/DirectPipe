name: directpipe

services:
  coturn:
    image: coturn/coturn:latest
    ports:
      - '3478:3478/udp'
      - '3478:3478/tcp'
      - '49152-49252:49152-49252/udp'
    command: >
      -n
      --fingerprint
      --use-auth-secret
      --total-quota=100
      --stale-nonce=600
      --no-tls
      --no-dtls
      --min-port=49152
      --max-port=49252
      --no-multicast-peers
      --no-cli
    environment:
      - COTURN_STATIC_AUTH_SECRET=${TURN_SECRET}
      - COTURN_REALM=${TURN_REALM}
    env_file:
      - ./envs/shared.env
      - ./envs/api.env
    networks:
      - app
    restart: unless-stopped

  api:
    build: ./api
    env_file:
      - ./envs/shared.env
      - ./envs/api.env
    depends_on:
      - coturn
    networks:
      - app
    restart: unless-stopped

  app:
    build:
      context: ./app
    env_file:
      - ./envs/shared.env
      - ./envs/app.env
    depends_on:
      - api
    networks:
      - app
    restart: unless-stopped

  gateway:
    image: nginx:alpine
    volumes:
      - ./infra/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - app
    networks:
      - app
      - proxy
    restart: unless-stopped

networks:
  app:
    driver: bridge
  proxy:
    external: true
    name: ${PROXY_NETWORK:-npm_proxy}
