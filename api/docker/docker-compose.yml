x-api-base: &api-base
  container_name: directpipe-api
  build:
    context: ..
    dockerfile: docker/Dockerfile
  env_file:
    - ../../envs/shared.env
    - ../../envs/api.env
  healthcheck:
    test: ["CMD", "sh", "-c", "wget -qO- http://localhost:4000/health >/dev/null 2>&1 || exit 1"]
    interval: 10s
    timeout: 5s
    retries: 12
    start_period: 30s

services:
  api:
    <<: *api-base
    profiles: ["development"]
    environment:
      NODE_ENV: development
    ports:
      - "4000:4000"
    volumes:
      - ..:/app
      - api_node_modules:/app/node_modules
    networks:
      - app
    depends_on:
      - coturn

  api_prod:
    <<: *api-base
    profiles: ["production"]
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
    expose:
      - "4000"
    networks:
      app:
        aliases:
          - api
    depends_on:
      - coturn

volumes:
  api_node_modules:
