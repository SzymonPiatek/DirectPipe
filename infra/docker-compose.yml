services:
  coturn:
    container_name: directpipe-coturn
    image: coturn/coturn:latest
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "49152-49252:49152-49252/udp"
    command: >
      -n
      --fingerprint
      --use-auth-secret
      --total-quota=100
      --stale-nonce=600
      --no-tls
      --no-dtls
      --min-port=49152
      --max-port=49252
      --no-multicast-peers
      --no-cli
    environment:
      - COTURN_STATIC_AUTH_SECRET=${TURN_SECRET}
      - COTURN_REALM=${TURN_REALM}
    env_file:
      - ../envs/shared.env
      - ../envs/api.env
    networks:
      - app
    restart: unless-stopped

  gateway:
    container_name: directpipe-gateway
    image: nginx:alpine
    ports:
      - "${GATEWAY_PORT:-3000}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - app
      - proxy
    restart: unless-stopped
